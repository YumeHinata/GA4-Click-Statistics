name: Views and Comments Sync

on:
  schedule:
    - cron: '25 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run GA4 Views Sync
        env:
          GA_CLIENT_ID: ${{ secrets.GA_CLIENT_ID }}
          GA_CLIENT_SECRET: ${{ secrets.GA_CLIENT_SECRET }}
          GA_REFRESH_TOKEN: ${{ secrets.GA_REFRESH_TOKEN }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          chmod +x sync.sh
          ./sync.sh

      - name: Run Twikoo Comments Sync
        env:
          BLOG_ORIGIN: https://www.yumehinata.com
          TWIKOO_ENV_ID: https://twikoo.yumehinata.com/
          TWIKOO_INCLUDE_REPLY: "true"
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet
          chmod +x sync-comments.sh
          ./sync-comments.sh
          
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/views.json data/comments.json

          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi

          git commit -m "chore: update page views and comments"
          git push
